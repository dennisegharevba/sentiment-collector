name: collect-sentiment
on:
  schedule:
    - cron: "7 * * * *"   # hourly, off the top of the hour
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collect.py
        env:
          SYMBOLS: "XAUUSD"                       # comma-separated, e.g. XAUUSD,EURUSD,GBPUSD
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}       # optional
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }} # optional
      - name: Commit data
        run: |
          git config user.name "sentiment-bot"
          git config user.email "sentiment-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "sentiment snapshot $(date -u +%FT%TZ)"
          git push
